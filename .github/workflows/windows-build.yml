# Builds the Windows installers (NSIS .exe and .msi).
#
# - Manual run (Actions tab → "Windows build" → Run workflow): the installers
#   are attached to the run as a downloadable artifact.
# - Pushing a `v*` tag: the installers are also uploaded to the GitHub release
#   for that tag on this repository (created if it does not exist yet).
#
# The macOS release flow (`scripts/distribute.sh`) is separate and unchanged.
# The build is unsigned and has no telemetry key (`WRITER_POSTHOG_KEY` is not
# set), so telemetry is compiled out.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # TEMPORARY: lets the workflow run before it is on the default branch
    # (workflow_dispatch only works from there). Remove before any upstream PR.
    branches: [windows-support]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22"
          cache: true
          run-install: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build installers
        working-directory: apps/desktop
        run: vp exec tauri build --bundles nsis,msi

      - uses: actions/upload-artifact@v7
        with:
          name: writer-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Never touch upstream's releases, even if this workflow is merged there.
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/') && github.repository != 'joelbqz/writer-computer'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Windows build of $TAG (unsigned)."
          gh release upload "$TAG" --clobber \
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe \
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
